# Build the analysis from public sources and publish the page to Cloudflare Pages
# (project "txcattle"). A push to main deploys to production; a manual run on another
# branch deploys a preview.
#
# Required repository settings:
#   Secrets:   NASS_API_KEY (free key from quickstats.nass.usda.gov/api)
#              CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID
#   Variables: FSIS_DIRECTORY_URL, FSIS_DIRECTORY_SHA256,
#              FSIS_SUPPLEMENT_URL, FSIS_SUPPLEMENT_SHA256
# No FSIS data is committed. FSIS refuses automated downloads, so the URLs point at an
# unmodified copy attached to a release in this repository (see README). The pinned
# checksums stop the run if a file changes.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (version in the comment). setup-uv no longer
# publishes major tags, and SHA pins protect the build from a retagged release.
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: txcattle
          POSTGRES_PASSWORD: txcattle
          POSTGRES_DB: txcattle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txcattle -d txcattle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://txcattle:txcattle@localhost:5432/txcattle
      TEST_DATABASE_URL: postgresql://txcattle:txcattle@localhost:5432/txcattle_test
      USE_LOCAL_PSQL: "1"
      PGHOST: localhost
      PGPASSWORD: txcattle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Create test database
        run: psql "postgresql://txcattle:txcattle@localhost:5432/txcattle" -c "CREATE DATABASE txcattle_test OWNER txcattle;"

      - name: Run tests
        run: uv run pytest -q

      # The Census County Business Patterns files (about 600 MB) are historical and do not
      # change, so they are cached between runs. fetch.py keeps files already present and
      # downloads only the missing ones, so a partial restore is fine.
      - name: Restore Census history files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw/cbp
          key: cbp-${{ hashFiles('ingest/fetch.py') }}
          restore-keys: cbp-

      - name: Build the pipeline
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          FSIS_DIRECTORY_URL: ${{ vars.FSIS_DIRECTORY_URL }}
          FSIS_DIRECTORY_SHA256: ${{ vars.FSIS_DIRECTORY_SHA256 }}
          FSIS_SUPPLEMENT_URL: ${{ vars.FSIS_SUPPLEMENT_URL }}
          FSIS_SUPPLEMENT_SHA256: ${{ vars.FSIS_SUPPLEMENT_SHA256 }}
        run: uv run ingest/run_pipeline.py

      # Same deploy command as the other jbirdkerr.net apps. The Wrangler version is pinned
      # and nothing is added to the project: no Wrangler dependency or config file.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.124.0 pages deploy site --project-name txcattle --branch "${{ github.ref_name }}" --commit-dirty=true
