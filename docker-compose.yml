services:
  db:
    image: postgis/postgis:16-3.4
    container_name: txcattle-db
    environment:
      POSTGRES_USER: txcattle
      POSTGRES_PASSWORD: txcattle
      POSTGRES_DB: txcattle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txcattle -d txcattle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
